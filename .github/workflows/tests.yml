name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v

  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/backtest/requirements.txt
      - name: Install dependencies
        run: pip install -r research/backtest/requirements.txt
      - name: Run backtest unit tests
        working-directory: research/backtest
        run: python -m unittest discover -s tests -v
